[package]
name = "auth-github"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.63"

[lints.clippy]
unwrap_used = "deny"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
