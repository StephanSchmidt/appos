# An example platform: the AppOS shell with Acme's CRM as a kit. Apps call
# acme:crm/customers like kv. See src/main.rs.
[package]
name = "acme-platform"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
# The kit's pages, from templates/, as apps make theirs.
askama = "0.16"
appos-shell = { path = "../../shell" }
chrono = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The derives for WIT records (Customer, Note) expand to wasmtime paths.
wasmtime = "50"
