# The CRM's fake: acme:crm/customers with made-up customers, as a Wasm kit
# for appos dev (`Crm::fake`). build.rs builds it for wasm32-wasip2.
[package]
name = "crm-fake"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
