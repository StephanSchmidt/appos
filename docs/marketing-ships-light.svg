<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21 -21 1242 482" width="1242" height="482" role="img" aria-label="How marketing ships with AppOS. Marketing describes an idea to its AI agent, which writes a web app. The app is built to WebAssembly and deployed to AppOS. An automatic review, for example with appfuzz, checks it; once it passes, it runs in a sandbox that users reach. Platform engineering sets the rules for that step."><rect x="-21" y="-21" width="1242" height="482" fill="#ffffff"/><defs><marker id="tf-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#59636e"/></marker></defs><rect x="620" y="0" width="580" height="440" fill="#f6f8fa" stroke="none" stroke-width="0"/><line x1="620" y1="0" x2="620" y2="440" stroke="#59636e" stroke-width="2" stroke-dasharray="7 7"/><rect x="0" y="0" width="84.39999999999999" height="24" fill="#ddf4ff" stroke="none" stroke-width="0"/><text x="8" y="16.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing=".9">YOUR TEAM</text><rect x="640" y="16" width="168.0" height="24" fill="#ddf4ff" stroke="none" stroke-width="0"/><text x="648" y="32.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="start" letter-spacing=".9">APPOS · THE PLATFORM</text><g fill="#0969da" stroke="#59636e" stroke-width="2.2" stroke-linejoin="round"><circle cx="60" cy="80" r="10"/><path d="M41,114 C41,100 49,94 60,94 C71,94 79,100 79,114 Z"/></g><text x="94" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">Marketing</text><text x="94" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">has the idea</text><polyline points="60,128 60,276" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#tf-w)"/><text x="74" y="206" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">describes it</text><rect x="0" y="280" width="150" height="120" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><g fill="none" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="332.0" width="28" height="21" rx="5"/><path d="M32 332.0V327.0M15 340.0v6M49 340.0v6"/><circle cx="32" cy="325.5" r="2" fill="#59636e"/><circle cx="27" cy="342.0" r="2.2" fill="#59636e" stroke="none"/><circle cx="37" cy="342.0" r="2.2" fill="#59636e" stroke="none"/><path d="M27 348.0h10"/></g><text x="62" y="338.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">AI agent</text><text x="62" y="357.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">any agent</text><polyline points="150,340 212,340" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#tf-w)"/><text x="181" y="330" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">writes</text><rect x="214" y="280" width="170" height="120" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><g fill="none" stroke="#59636e" stroke-width="2.2" stroke-linejoin="round"><rect x="230" y="327.0" width="32" height="26"/><path d="M230 334.0h32"/><circle cx="235" cy="330.5" r="1.1" fill="#59636e"/><circle cx="239.5" cy="330.5" r="1.1" fill="#59636e"/></g><text x="276" y="338.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">Web app</text><text x="276" y="357.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">their language</text><polyline points="384,340 446,340" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#tf-w)"/><text x="415" y="330" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">builds</text><rect x="448" y="280" width="138" height="120" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><rect x="448" y="280" width="138" height="6" fill="#0969da" stroke="none" stroke-width="0"/><text x="464" y="338.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">app.wasm</text><text x="464" y="357.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">WebAssembly</text><polyline points="586,340 676,340" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#tf-w)"/><text x="654" y="330" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">deploy</text><rect x="680" y="280" width="280" height="140" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><text x="696" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start">Automatic review</text><text x="696" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">runs the app instead of reading it</text><rect x="680" y="378" width="280" height="42" fill="#ddf4ff" stroke="#d1d9e0" stroke-width="1.5"/><text x="696" y="404.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">appfuzz</text><text x="946" y="403.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#1f2328" text-anchor="end">one way to automate it</text><rect x="680" y="50" width="280" height="170" fill="#25292e" stroke="#d1d9e0" stroke-width="1.5"/><rect x="702" y="72" width="150" height="76" fill="#ddf4ff" stroke="#d1d9e0" stroke-width="2"/><text x="718" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start">App</text><text x="718" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">the team’s app</text><text x="702" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">Sandbox</text><text x="944" y="199" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#d1d9e0" text-anchor="end">only what is granted</text><polyline points="800,278 800,224" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#tf-w)"/><text x="790" y="256" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">passes</text><g fill="#ffffff" stroke="#59636e" stroke-width="2.2" stroke-linejoin="round"><circle cx="1034" cy="123" r="10"/><path d="M1015,157 C1015,143 1023,137 1034,137 C1045,137 1053,143 1053,157 Z"/></g><text x="1068" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">User</text><text x="1068" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">anyone using it</text><polyline points="962,135 1004,135" fill="none" stroke="#59636e" stroke-width="2" marker-start="url(#tf-w)" marker-end="url(#tf-w)"/><text x="983" y="124" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">uses</text><g fill="#ffffff" stroke="#59636e" stroke-width="2.2" stroke-linejoin="round"><circle cx="1034" cy="236" r="10"/><path d="M1015,270 C1015,256 1023,250 1034,250 C1045,250 1053,256 1053,270 Z"/></g><text x="1068" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">Platform</text><text x="1068" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">engineering</text><line x1="1004" y1="252" x2="806" y2="252" stroke="#59636e" stroke-width="2"/><circle cx="801" cy="252" r="5" fill="#59636e"/><text x="905" y="242" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">sets the rules</text></svg>
