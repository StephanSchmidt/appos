# The native side: the shell, the `appos` CLI and an example platform
# (examples/acme-platform). Apps build for wasm in their own workspaces
# (see examples/).
[workspace]
resolver = "3"
members = ["shell", "cli", "examples/acme-platform"]

[workspace.package]
rust-version = "1.100"

[workspace.lints.cargo]
unused_dependencies = "deny"

[profile.release]
lto = true
strip = true
