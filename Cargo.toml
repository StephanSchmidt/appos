# The native side: the shell and the `appos` CLI. Apps build for wasm in
# their own workspaces (see examples/).
[workspace]
resolver = "3"
members = ["shell", "cli"]

[workspace.package]
rust-version = "1.100"

[workspace.lints.cargo]
unused_dependencies = "deny"

[profile.release]
lto = true
strip = true
