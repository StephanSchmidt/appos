{%- import "admin/console/macros.html" as m -%}
<button class="c-slide{% if !on %} off{% endif %}{% if upright %} v{% endif %}{% if dead %} dead{% endif %}" role="switch" aria-checked="{{ on && !dead }}"{% if dead %} type="button" aria-disabled="true"{% endif %} aria-label="{{ label }}"{% call m::shortcut(letter) %}{% endcall %} data-hint="{{ hint }}">{% call m::corner(letter) %}{% endcall %}<span class="c-ends"><span class="c-led{% if !leds.0.is_empty() %} {{ leds.0 }}{% endif %}"></span><span class="c-led{% if !leds.1.is_empty() %} {{ leds.1 }}{% endif %}"></span></span><span class="c-track"><span class="c-nub"></span></span>{% if !caption.is_empty() %}<span class="c-silk dim">{{ caption }}</span>{% endif %}</button>
