[package]
name = "appos-shell"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "The AppOS shell: runs WebAssembly apps behind one layout, with routes, access and storage owned by the shell."

[lints]
workspace = true

[dependencies]
anyhow = "1"
# The admin screen's HTML (admin/, templates/admin/), as apps make theirs.
askama = "0.16"
axum = "0.8"
# Signed session cookies.
base64 = "0.22"
# Who may call what: policy.csv (access.rs).
casbin = { version = "2.20", default-features = false, features = ["runtime-tokio"] }
chrono = "0.4"
# Deflate for app.zip, in pure Rust (zip leaves the backend to the crate using it).
flate2 = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hmac = "0.13"
parking_lot = "0.12"
rusqlite = { version = "0.42", features = ["bundled", "hooks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
# OIDC sign-in: discovery and the token endpoint (auth/oidc.rs).
ureq = "3"
toml = "1"
wasmtime = "50"
# Reads kits' WIT, for the contract apps build against.
wit-parser = "0.261"
wasmtime-wasi = "50"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

