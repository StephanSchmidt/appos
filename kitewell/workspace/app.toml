[app]
id = "workspace"
name = "Workspace"
version = "0.1.0"
owner = "Jonas Berg <jonas.berg@example.com>"
group = "Product"
wasm = "target/workspace.wasm"

[capabilities]
grant = ["booking-read", "booking-configure", "booking-setup", "kv-read", "kv-write"]

[[data]]
what = "Name and email address of each team member the customer adds"
where = "booking kit"
why = "Set up the customer's workspace"

[[data]]
what = "Add-ons and template a customer picks, and which bookings are configured; nothing about people"
where = "booking kit and kv"
why = "Configure the workspace"
