<div class="flow">
  {% include "steps.html" %}

  <header class="intro">
    <h1>Choose your plan</h1>
    <p class="lead">Tell us your team size and pick a plan.</p>
  </header>

  <div class="split">
    <form class="card" method="post" action="{{ action }}">
      <div class="field">
        <label for="users">How many people are on your team?</label>
        <input id="users" type="number" name="users" min="1" value="{{ users }}" inputmode="numeric">
      </div>
      <fieldset class="group">
        <legend>Plan</legend>
        {% for plan in plans %}
        <label class="choice"><input type="radio" name="plan" value="{{ plan.value }}"{% if plan.checked %} checked{% endif %}><span><strong>{{ plan.label }}</strong><small>{{ plan.note }}</small></span></label>
        {% endfor %}
      </fieldset>
      <p class="error">{{ error }}</p>
      <div class="actions"><button>Continue</button></div>
    </form>

    <form class="card summary" method="post" action="{{ action }}">
      <label for="code">Have an offer from us?</label>
      <input id="code" type="text" name="code" value="{{ code }}" placeholder="KW-ACME-2026" autocomplete="off">
      <p class="error">{{ code_error }}</p>
      <button class="quiet">Use the offer</button>
    </form>
  </div>
</div>
