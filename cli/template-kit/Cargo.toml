[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

# make check fails on these. A bare unwrap() hides why something can't fail;
# write expect("why") instead (tests may unwrap, see clippy.toml).
[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
unwrap_used = "deny"

[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
